services:
  swift-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - CODE_SERVER_PASSWORD=yourpassword
    volumes:
      - swift-spm-cache:/home/vscode/.cache/org.swift.swiftpm
      - xtool-config:/home/vscode/.config/xtool
      - onboarding-state:/home/vscode/.config/swift-devcontainer
      - project:/home/vscode/project
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  swift-spm-cache:
  xtool-config:
  onboarding-state:
  project: